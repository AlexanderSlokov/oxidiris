[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
# Edition 2024 itself only needs 1.85, but ratatui 0.30 and its dependency tree require 1.88.
# Keep this in sync with the MSRV job in .github/workflows/ci.yml.
rust-version = "1.88"
authors = ["Aleksandr Slokov"]
repository = "https://github.com/AlexanderSlokov/oxidiris"
readme = "README.md"
keywords = ["rsvp", "speed-reading", "tui", "accessibility", "reader"]
categories = ["command-line-utilities", "text-processing", "accessibility"]

[workspace.dependencies]
# --- core (must stay terminal-free, wasm-compatible) ---
unicode-segmentation = "1.12"
unicode-normalization = "0.1"
unicode-width = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
thiserror = "2"

# --- pdf extraction (native only: pulls in font and codec crates, never linked into core) ---
pdf-extract = "0.12"

# --- binary only ---
ratatui = "0.30.2"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
encoding_rs = "0.8"

# --- dev ---
proptest = "1"
insta = "1"

[profile.release]
lto = "thin"
strip = true